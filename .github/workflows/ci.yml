name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race -covermode=atomic ./...

      - name: Eval corpus gate
        run: |
          go run ./cmd/agent eval -corpus testdata/eval -min-f1 0.85

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --timeout=5m

      # EDR agents intentionally read operator-supplied paths (G304), walk trees (G122),
      # compare dpkg MD5 digests (G401/G501), and invoke fixed system tools (G204).
      # Rule-name constants that mention passwd/secret trip G101. Exclude those noise
      # rules; keep the rest (and skip the lab demo console).
      - name: gosec
        uses: securego/gosec@v2.28.0
        with:
          args: >-
            -exclude=G304,G101,G122,G401,G501,G204,G301,G306,G104
            -exclude-dir=cmd/demo-console
            -exclude-dir=testdata
            ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: SBOM
        run: |
          go install github.com/anchore/syft/cmd/syft@latest
          syft packages dir:. -o cyclonedx-json > sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  release-signing:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
      - run: go build -o ghostcatcher ./cmd/agent
      - uses: sigstore/cosign-installer@v3
      - name: Cosign sign binary
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign-blob --yes ghostcatcher --output-signature ghostcatcher.sig
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            ghostcatcher
            ghostcatcher.sig
