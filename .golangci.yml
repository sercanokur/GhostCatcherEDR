run:
  timeout: 5m
  # Do not enable with_yara / with_ebpf here: those optional deps are not in
  # go.mod for the default CI binary. Tag-gated files are still typechecked
  # when developers build locally with -tags.

linters:
  disable-all: true
  enable:
    - errcheck
    - gofmt
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
    - unconvert
    - revive

linters-settings:
  revive:
    rules:
      - name: exported
        disabled: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - staticcheck
